name: Extract VEYLO Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*VEYLO*automation*package*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "VEYLO ZIP file not found in repository root."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/veylo"
          unzip -o "$ZIP" -d "$RUNNER_TEMP/veylo"
          cp -a "$RUNNER_TEMP/veylo/." .
          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract VEYLO automation package"
          git push
