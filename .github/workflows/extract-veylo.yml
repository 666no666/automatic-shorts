name: Extract VEYLO Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract package
        run: |
          ZIP="VEYLO_automation_package.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP not found in repository root"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/veylo"
          unzip -o "$ZIP" -d "$RUNNER_TEMP/veylo"

          cp -a "$RUNNER_TEMP/veylo/." .

          rm -f .github/workflows/veylo.yml
          rm -f "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Add VEYLO application files"
            git push
          else
            echo "No changes to commit"
          fi
