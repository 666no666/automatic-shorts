name: Test Shorts Generator

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PurffleShorts
        run: |
          python -m pip install --upgrade pip
          pip install git+https://github.com/Chamanrajragu/purffle-shorts

      - name: Generate test video
        run: |
          python -m purffle_shorts demo
